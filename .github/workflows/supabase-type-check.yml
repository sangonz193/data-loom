name: Supabase Type Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Start Supabase local development setup
        run: bunx --no-install supabase start

      - name: Verify generated types are checked in
        run: |
          bunx --no-install supabase gen types typescript --local > supabase/types.gen.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet supabase/types.gen.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi
